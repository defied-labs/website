name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-test:
    name: Lint, Typecheck & Tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "mysql://test:test@localhost:3306/defied_test"
      AUTH_SECRET: "this-is-a-super-secret-test-auth-secret-12345"
      AUTH_URL: "http://localhost:3001"
      AUTH_TRUST_HOST: "true"
      STRIPE_SECRET_KEY: "sk_test_ci_mock_key"
      STRIPE_WEBHOOK_SECRET: "whsec_ci_mock_secret"
      CORS_ORIGIN: "http://localhost:3001"
      NODE_ENV: "test"
      SMTP_HOST: "localhost"
      SMTP_PORT: "587"
      SMTP_SECURE: "false"
      SMTP_USER: "ci"
      SMTP_PASS: "ci"
      SMTP_FROM: "ci@defied.dev"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Workspace Validation
        run: pnpm run validate

      - name: Generate Prisma Client
        run: pnpm run db:generate

      - name: Check TypeScript Types
        run: pnpm run check-types

      - name: Run Unit & Integration Tests with Coverage
        run: pnpm run test:coverage

      - name: Build Packages & Applications
        run: pnpm run build

  e2e:
    name: E2E Smoke Tests
    needs: validate-and-test
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "mysql://test:test@localhost:3306/defied_test"
      AUTH_SECRET: "this-is-a-super-secret-test-auth-secret-12345"
      AUTH_URL: "http://localhost:3001"
      AUTH_TRUST_HOST: "true"
      STRIPE_SECRET_KEY: "sk_test_ci_mock_key"
      STRIPE_WEBHOOK_SECRET: "whsec_ci_mock_secret"
      CORS_ORIGIN: "http://localhost:3001"
      NODE_ENV: "production"
      SMTP_HOST: "localhost"
      SMTP_PORT: "587"
      SMTP_SECURE: "false"
      SMTP_USER: "ci"
      SMTP_PASS: "ci"
      SMTP_FROM: "ci@defied.dev"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm run db:generate

      - name: Build Web Application
        run: pnpm --filter web build

      - name: Install Playwright Browsers
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Run Playwright E2E Smoke Tests
        run: |
          pnpm --filter web start &
          pnpm --filter web exec playwright test
        env:
          PLAYWRIGHT_TEST_BASE_URL: "http://localhost:3001"

      - name: Upload Playwright Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
